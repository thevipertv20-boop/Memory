<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Google Fonts "Red Rose" (Titel) und "Almarai" (Eyebrow) fuer den Home-Screen (Figma-Vorgabe) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Rose:wght@700&family=Almarai:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/main.js"></script>
</head>

<body>

    <!-- Alpha-Fix fuer Img/Icons/stadia_controller.png: das Original-PNG hat einen
         auf max. ~5% gedeckelten Alpha-Kanal; dieser Filter streckt ihn auf den
         vollen Bereich, damit brightness/invert/opacity in CSS wieder greifen. -->
    <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
        <filter id="icon-alpha-boost">
            <feComponentTransfer>
                <feFuncA type="linear" slope="20" />
            </feComponentTransfer>
        </filter>

        <!-- Erzwingt die exakte Figma-Farbe #F0EA6E fuer das Home-Wasserzeichen:
             boostet zuerst den Alpha-Kanal (siehe icon-alpha-boost), fuellt dann
             mit der Zielfarbe und komponiert sie ueber die (geboostete) Silhouette. -->
        <filter id="icon-gold-fill" color-interpolation-filters="sRGB">
            <feComponentTransfer in="SourceGraphic" result="alpha-boosted">
                <feFuncA type="linear" slope="20" />
            </feComponentTransfer>
            <feFlood flood-color="#F0EA6E" flood-opacity="1" result="flood" />
            <feComposite in="flood" in2="alpha-boosted" operator="in" />
        </filter>
    </svg>

    <!-- Screen: Homescreen -->
    <section id="screen-home" class="screen">
        <div class="home">
            <img class="home__icon" src="Img/Icons/stadia_controller.png" alt="" aria-hidden="true">

            <div class="home__content">
                <p class="home__eyebrow">It's play time.</p>

                <div class="home__title-group">
                    <h1 class="home__title">Ready to play?</h1>

                    <button id="btn-start" class="btn btn--primary home__cta" type="button">
                        <img class="home__cta-image" src="Img/Icons/Primary button.png" alt="Play">
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Screen: Settings -->
    <!-- Figma-Referenz "Content5.png": alle drei Options-Gruppen und die
         Preview stehen gleichzeitig auf EINER Seite, keine Unterseiten mehr.
         Die untere Tab-Leiste navigiert nicht mehr, sie ist nur noch eine
         visuelle Gliederung. -->
    <section id="screen-settings" class="screen" hidden>
        <div class="settings">
            <div class="settings__panel">
                <h1 class="settings__title"><img src="Img/Icons/Headline.png" width="263" height="79" alt="Settings"></h1>

                <div class="settings__columns">
                    <div class="settings__options">
                        <fieldset id="settings-group-gametheme" class="settings__group settings__group--gametheme">
                            <legend class="settings__legend">
                                <svg class="settings__legend-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <path d="M12 2a10 10 0 1 0 0 20c1.4 0 2-.9 2-1.9 0-.5-.25-.95-.55-1.35-.3-.4-.55-.8-.55-1.35 0-1 .85-1.7 1.85-1.7H16c2.2 0 4-1.8 4-4C20 6 16.4 2 12 2Z" />
                                    <circle cx="7.5" cy="10.5" r="1.15" fill="currentColor" stroke="none" />
                                    <circle cx="10.5" cy="6.8" r="1.15" fill="currentColor" stroke="none" />
                                    <circle cx="15" cy="7.3" r="1.15" fill="currentColor" stroke="none" />
                                    <circle cx="17" cy="11.5" r="1.15" fill="currentColor" stroke="none" />
                                </svg>
                                Game themes
                            </legend>

                            <div id="settings-gametheme" class="option-group"></div>
                        </fieldset>

                        <fieldset id="settings-group-player" class="settings__group settings__group--player">
                            <legend class="settings__legend">
                                <svg class="settings__legend-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <circle cx="12" cy="8" r="4" />
                                    <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7" />
                                </svg>
                                Choose player
                            </legend>
                            <div id="settings-player" class="option-group"></div>
                        </fieldset>

                        <fieldset id="settings-group-board" class="settings__group settings__group--board">
                            <legend class="settings__legend">
                                <svg class="settings__legend-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                    <rect x="7.3" y="3.3" width="12" height="16" rx="2" transform="rotate(8 13.3 11.3)" />
                                    <rect x="5" y="5" width="12" height="16" rx="2" />
                                </svg>
                                Board size
                            </legend>
                            <div id="settings-size" class="option-group"></div>
                        </fieldset>
                    </div>

                    <div class="settings__preview">
                        <img id="settings-preview-image" class="settings__preview-image" src="Img/Theme Visual.png" width="460" height="412" alt="Vorschau: Code vibes Theme">
                        <!-- Fuer "DA Projects"/"Foods" liegt kein eigens zugeschnittenes
                             Vorschau-Asset vor (anders als Theme Visual.png/Frame 628 (1).png
                             fuer Code vibes/Gaming), nur die volle Figma-Seitenreferenz
                             (Img/Content14.png / Content15.png). Dieser Ausschnitt-Rahmen
                             zeigt daher exakt den 460x412px-Vorschau-Bereich aus der
                             jeweiligen Original-Referenz (siehe .settings__preview-crop in
                             _settings.scss) - keine neue Asset-Datei, nur ein CSS-Crop. -->
                        <div id="settings-preview-crop" class="settings__preview-crop" hidden>
                            <img id="settings-preview-crop-image" class="settings__preview-crop-image" src="" alt="">
                        </div>
                    </div>
                </div>

                <!-- Figma-Asset "Img/selection + button.png": komplette Leiste
                     (Labels, Trenner, Start-Button-Optik) als ein Bild - der
                     Start-Button bleibt als unsichtbares, exakt darueber
                     positioniertes <button> real klickbar (siehe
                     .settings__start-hit in _settings.scss). -->
                <div class="settings__tabbar">
                    <img class="settings__tabbar-image" src="Img/selection + button.png" width="547" height="81" alt="Game theme / Player / Board size">
                    <button id="btn-settings-start" class="settings__start-hit" type="button" aria-label="Start"></button>
                </div>
            </div>
        </div>
    </section>

    <!-- Screen: Spiel -->
    <section id="screen-game" class="screen" hidden>
        <div class="game">
            <header class="hud">
                <div id="hud-player-1" class="hud__player">
                    <span id="hud-label-1" class="hud__label"></span>
                    <span id="hud-score-1" class="hud__score">0</span>
                </div>

                <button id="btn-exit-game" class="btn btn--primary" type="button">Exit Game</button>

                <div id="hud-player-2" class="hud__player">
                    <span id="hud-label-2" class="hud__label"></span>
                    <span id="hud-score-2" class="hud__score">0</span>
                </div>
            </header>

            <div id="board" class="board"></div>
        </div>

        <!-- Exit-Game-Bestaetigungs-Popup: abgedunkelter Hintergrund + weisser
             abgerundeter Panel-Container, darin die Frage als echter Text und
             zwei echte Original-Figma-Buttons als Hintergrundbild auf echten
             <button>-Elementen (kein Nachbau, keine Ueberlagerung, kein
             Rahmen/Hintergrund hinter den PNGs - siehe .exit-popup__button in
             layout/_hud.scss):
             "No, back to game" -> Img/Icons/Property 12=default.png (Normal)
             / Property 4=Hover.png (Hover)
             "Exit game" -> Img/Icons/Property 1=Default.png (Normal) /
             Property 1=hover.png (Hover) -->
        <div id="exit-popup" class="exit-popup" hidden>
            <div class="exit-popup__panel">
                <p class="exit-popup__question">Are you sure you want to quit the game?</p>
                <div class="exit-popup__actions">
                    <button id="btn-exit-cancel" class="exit-popup__button exit-popup__button--cancel" type="button" aria-label="Back to game"></button>
                    <button id="btn-exit-confirm" class="exit-popup__button exit-popup__button--confirm" type="button" aria-label="Exit game"></button>
                </div>
            </div>
        </div>
    </section>

    <!-- Screen: Game Over (Overlay) -->
    <!-- Figma-Assets "Img/Content2 (1).png" (Winner Orange), "Img/Content3 (1).png"
         (Winner Blue) und "Img/Content4 (1).png" (Draw): je nach Ausgang wird das
         passende Bild angezeigt. Der "Back to start"-Button ist in den Bildern
         bereits eingezeichnet - #btn-new-round bleibt ein echtes klickbares
         <button>, unsichtbar exakt darueber positioniert (siehe
         .gameover__outcome-hit in _gameover.scss), analog zum Settings-Start-
         Button. -->
    <section id="screen-gameover" class="screen screen--overlay" hidden>
        <div class="gameover">
            <!-- Figma-Asset "Img/Confetti.png": nur bei Winner Orange/Blue
                 sichtbar, nicht bei Draw (siehe ts/gameover.ts). -->
            <img id="gameover-confetti" class="gameover__confetti" src="Img/Confetti.png" alt="">
            <h1 id="gameover-title" class="gameover__title">Game Over</h1>
            <p id="gameover-result" class="gameover__result-sr"></p>

            <div class="gameover__scores">
                <div id="gameover-player-1" class="gameover__player hud__player">
                    <span id="gameover-label-1" class="hud__label"></span>
                    <span id="gameover-score-1" class="hud__score">0</span>
                </div>
                <div id="gameover-player-2" class="gameover__player hud__player">
                    <span id="gameover-label-2" class="hud__label"></span>
                    <span id="gameover-score-2" class="hud__score">0</span>
                </div>
            </div>

            <div id="gameover-outcome" class="gameover__outcome">
                <img id="gameover-outcome-image" class="gameover__outcome-image" src="" alt="">
                <button id="btn-new-round" class="gameover__outcome-hit" type="button" aria-label="Play Again"></button>
            </div>
        </div>
    </section>

</body>

</html>
