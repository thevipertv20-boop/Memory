<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <!-- Google Fonts "Red Rose" (Titel) und "Almarai" (Eyebrow) fuer den Home-Screen (Figma-Vorgabe) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Rose:wght@700&family=Almarai:wght@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/main.js"></script>
</head>

<body>

    <!-- Alpha-Fix fuer Img/Icons/stadia_controller.png: das Original-PNG hat einen
         auf max. ~5% gedeckelten Alpha-Kanal; dieser Filter streckt ihn auf den
         vollen Bereich, damit brightness/invert/opacity in CSS wieder greifen. -->
    <svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden">
        <filter id="icon-alpha-boost">
            <feComponentTransfer>
                <feFuncA type="linear" slope="20" />
            </feComponentTransfer>
        </filter>

        <!-- Erzwingt die exakte Figma-Farbe #F0EA6E fuer das Home-Wasserzeichen:
             boostet zuerst den Alpha-Kanal (siehe icon-alpha-boost), fuellt dann
             mit der Zielfarbe und komponiert sie ueber die (geboostete) Silhouette. -->
        <filter id="icon-gold-fill" color-interpolation-filters="sRGB">
            <feComponentTransfer in="SourceGraphic" result="alpha-boosted">
                <feFuncA type="linear" slope="20" />
            </feComponentTransfer>
            <feFlood flood-color="#F0EA6E" flood-opacity="1" result="flood" />
            <feComposite in="flood" in2="alpha-boosted" operator="in" />
        </filter>
    </svg>

    <!-- Screen: Homescreen -->
    <section id="screen-home" class="screen">
        <div class="home">
            <img class="home__icon" src="Img/Icons/stadia_controller.png" alt="" aria-hidden="true">

            <div class="home__content">
                <p class="home__eyebrow">It's play time.</p>

                <div class="home__title-group">
                    <h1 class="home__title">Ready to play?</h1>

                    <button id="btn-start" class="btn btn--primary home__cta" type="button">
                        <img class="home__cta-image" src="Img/Icons/Primary button.png" alt="Play">
                    </button>
                </div>
            </div>
        </div>
    </section>

    <!-- Screen: Settings -->
    <section id="screen-settings" class="screen" hidden>
        <div class="settings">
            <div class="settings__panel">
                <h1 class="settings__title">Settings</h1>

                <nav class="settings__menu">
                    <button type="button" id="settings-step-gametheme" class="settings__menu-item">
                        <span class="settings__menu-dot settings__menu-dot--gametheme"></span>
                        <span class="settings__menu-label">Game theme</span>
                        <span class="settings__menu-arrow" aria-hidden="true">→</span>
                    </button>
                    <button type="button" id="settings-step-player" class="settings__menu-item">
                        <span class="settings__menu-dot settings__menu-dot--player"></span>
                        <span class="settings__menu-label">Player</span>
                        <span class="settings__menu-arrow" aria-hidden="true">→</span>
                    </button>
                    <button type="button" id="settings-step-board" class="settings__menu-item">
                        <span class="settings__menu-dot settings__menu-dot--board"></span>
                        <span class="settings__menu-label">Board size</span>
                        <span class="settings__menu-arrow" aria-hidden="true">→</span>
                    </button>
                </nav>

                <button id="btn-settings-start" class="btn btn--primary settings__start" type="button">Start</button>
            </div>
        </div>
    </section>

    <!-- Screen: Settings - Game theme -->
    <section id="screen-settings-theme" class="screen" hidden>
        <div class="settings">
            <div class="settings__panel">
                <button type="button" id="settings-back-gametheme" class="settings__back">
                    <span aria-hidden="true">←</span> Back
                </button>

                <h1 class="settings__title">Game theme</h1>

                <div class="settings__columns">
                    <div class="settings__options">
                        <fieldset id="settings-group-gametheme" class="settings__group settings__group--gametheme">
                            <legend class="settings__legend">Game themes</legend>

                            <div class="settings__subgroup">
                                <span class="settings__sublabel">Layout</span>
                                <div id="settings-layout" class="option-group"></div>
                            </div>

                            <div class="settings__subgroup">
                                <span class="settings__sublabel">Motif</span>
                                <div id="settings-theme" class="option-group"></div>
                            </div>
                        </fieldset>
                    </div>

                    <div class="settings__preview">
                        <div id="settings-preview-board" class="settings__preview-board theme--tiere">
                            <div class="card settings__preview-card settings__preview-card--back">
                                <div class="card__inner">
                                    <div class="card__face card__face--back"></div>
                                    <div class="card__face card__face--front"></div>
                                </div>
                            </div>
                            <div class="card card--flipped settings__preview-card settings__preview-card--front">
                                <div class="card__inner">
                                    <div class="card__face card__face--back"></div>
                                    <div class="card__face card__face--front" id="settings-preview-motif">🐶</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Screen: Settings - Player -->
    <section id="screen-settings-player" class="screen" hidden>
        <div class="settings">
            <div class="settings__panel">
                <button type="button" id="settings-back-player" class="settings__back">
                    <span aria-hidden="true">←</span> Back
                </button>

                <h1 class="settings__title">Player</h1>

                <fieldset id="settings-group-player" class="settings__group settings__group--player">
                    <legend class="settings__legend">Choose player</legend>
                    <div id="settings-player" class="option-group"></div>
                </fieldset>
            </div>
        </div>
    </section>

    <!-- Screen: Settings - Board size -->
    <section id="screen-settings-board" class="screen" hidden>
        <div class="settings">
            <div class="settings__panel">
                <button type="button" id="settings-back-board" class="settings__back">
                    <span aria-hidden="true">←</span> Back
                </button>

                <h1 class="settings__title">Board size</h1>

                <fieldset id="settings-group-board" class="settings__group settings__group--board">
                    <legend class="settings__legend">Board size</legend>
                    <div id="settings-size" class="option-group"></div>
                </fieldset>
            </div>
        </div>
    </section>

    <!-- Screen: Spiel -->
    <section id="screen-game" class="screen" hidden>
        <div class="game">
            <header class="hud">
                <div id="hud-player-1" class="hud__player">
                    <span id="hud-label-1" class="hud__label"></span>
                    <span id="hud-score-1" class="hud__score">0</span>
                </div>

                <button id="btn-exit-game" class="btn btn--primary" type="button">Exit Game</button>

                <div id="hud-player-2" class="hud__player">
                    <span id="hud-label-2" class="hud__label"></span>
                    <span id="hud-score-2" class="hud__score">0</span>
                </div>
            </header>

            <div id="board" class="board"></div>
        </div>
    </section>

    <!-- Screen: Game Over (Overlay) -->
    <section id="screen-gameover" class="screen screen--overlay" hidden>
        <div class="gameover">
            <h1 class="gameover__title">Game Over</h1>
            <p id="gameover-result" class="gameover__result"></p>

            <div class="gameover__scores">
                <div id="gameover-player-1" class="gameover__player hud__player">
                    <span id="gameover-label-1" class="hud__label"></span>
                    <span id="gameover-score-1" class="hud__score">0</span>
                </div>
                <div id="gameover-player-2" class="gameover__player hud__player">
                    <span id="gameover-label-2" class="hud__label"></span>
                    <span id="gameover-score-2" class="hud__score">0</span>
                </div>
            </div>

            <button id="btn-new-round" class="btn btn--primary" type="button">Play Again</button>
        </div>
    </section>

</body>

</html>
